name: Test backup restore

# Verifies the backup pipeline actually produces a restorable dump —
# manual only, run whenever you want to sanity-check the backups
# branch. Restores into a throwaway Postgres 18 service container
# (matching Railway's server version) that's discarded when the job
# ends; never touches the real database.
on:
  workflow_dispatch: {}

jobs:
  test-restore:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: backups

      - name: Install postgresql-client (v18, from PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Restore the most recent dump
        run: |
          latest=$(ls -t backups/*.dump | head -1)
          echo "Restoring $latest"
          /usr/lib/postgresql/18/bin/pg_restore \
            --no-owner --no-acl \
            -d "postgresql://test:test@localhost:5432/test" \
            "$latest"

      - name: Sanity-check the restored data
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          PSQL="psql postgresql://test:test@localhost:5432/test"
          echo "== Tables =="
          $PSQL -c '\dt'
          echo "== Row counts =="
          for t in Member Portfolio Project Media SocialLink Section CanvasElement PageView; do
            printf "%-15s " "$t"
            $PSQL -t -c "SELECT count(*) FROM \"$t\";"
          done
